[package]
name = "harness"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.63"

[profile.release]
lto = true
opt-level = "s"
strip = true
panic = "abort"

# Standalone: this package is not a member of the workspace it happens to sit in
[workspace]
