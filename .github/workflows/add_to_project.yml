name: Add issues/prs to FS tracker project

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add issue/prs to FS tracker project
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/CHESS-mission/projects/5
          github-token: ${{ secrets.ADD_TO_PROJECT }}