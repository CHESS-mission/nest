[workspace]
resolver = "2"
package.license = "MIT"
package.repository = "https://github.com/CHESS-mission/nest"
package.readme = "README.md"
members = [
  "crates/nest-webapp",
  "crates/nest-hydrate",
  "crates/nest-server",
  "crates/nest-api"
]

# Need to be applied only to wasm build
[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'

[workspace.dependencies]
leptos = "0.8.3"
leptos_axum = "0.8.3"
leptos_meta = "0.8.3"
leptos_router = "0.8.3"
wasm-bindgen = "=0.2.130"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nalgebra = "0.34.1"
ndarray = "0.17.1"

# See https://github.com/leptos-rs/cargo-leptos for documentation of all the parameters.
[[workspace.metadata.leptos]]
name = "nest"
bin-package = "nest-server"
lib-package = "nest-hydrate"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
tailwind-input-file = "style/tailwind-input.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = []
bin-default-features = false
lib-features = []
lib-default-features = false
