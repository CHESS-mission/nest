environment_variables:
  - 
    name: test
    type: text

components:
  - 
    name: QEMU
    type: qemu
    config:
      arch: arm
      mem_mb: 1024
      options: 
        - option: cpu
          value: cortex-a7
        - option: M
          value: virt
        - option: kernel
          value: ./image/zImage 
        - option: append
          value: rootwait root=/dev/vda console=ttyAMA0 
        - option: drive
          value: if=none,file=./image/disk.qcow2,id=hd0 
        - option: device
          value: virtio-blk-device,drive=hd0 
        - option: serial
          value: pty:/tmp/qemu-serial-pty 
        - option: nographic 
      i2c_timeout_ms: 10
      ngpio: 8
      gpio_names: 
        5: echo_out
        7: echo_in 
    ports:
      system:
        - name: i2c
          type: json
  - 
    name: TEMP
    type: wasm
    config:
      module: component_artifacts/sensor_temp.wasm
    ports:
      system:
      - name: i2c
        type: json

wires:
  - 
    - component: QEMU
      port: i2c
    - component: TEMP
      port: i2c
