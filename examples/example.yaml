environment_variables:
  - name: B_field
    type: vec3

components:
  - name: QEMU1
    type: qemu
    config:
      arch: arm
      mem_mb: 1024
      options: 
        - option: cpu
          value: cortex-a7
        - option: M
          value: virt
        - option: kernel
          value: ./image/zImage 
        - option: append
          value: rootwait root=/dev/vda console=hvc0
        - option: drive
          value: if=none,file=./image/disk.qcow2,id=hd0 
        - option: device
          value: virtio-blk-device,drive=hd0 
        - option: nographic 

        # Use virtual console to leave UART ports available
        - option: device
          value: virtio-serial
        - option: chardev
          value: pty,path=/tmp/qemu-serial-pty,id=char0
        - option: device
          value: virtconsole,chardev=char0
      i2c_timeout_ms: 10
      ngpio: 8
      gpio_names: 
        5: echo_out
        7: echo_in 
      nuart: 2
    ports:
      system:
        - name: i2c
          type: i2c
        - name: gpio0
          type: bool
        - name: uart0
          type: bytes
        - name: uart1
          type: bytes

  - name: QEMU2
    type: qemu
    config:
      arch: arm
      mem_mb: 1024
      options: 
        - option: cpu
          value: cortex-a7
        - option: M
          value: virt
        - option: kernel
          value: ./image-copy/zImage 
        - option: append
          value: rootwait root=/dev/vda console=hvc0
        - option: drive
          value: if=none,file=./image-copy/disk.qcow2,id=hd0 
        - option: device
          value: virtio-blk-device,drive=hd0 
        - option: nographic 

        # Use virtual console to leave UART ports available
        - option: device
          value: virtio-serial
        - option: chardev
          value: pty,path=/tmp/qemu-serial-pty2,id=char0
        - option: device
          value: virtconsole,chardev=char0
      i2c_timeout_ms: 20
      nuart: 1
    ports:
      system:
        - name: i2c
          type: i2c
        - name: uart0
          type: bytes

  - name: MMC5983MA
    type: wasm
    config:
      module: component_artifacts/mmc5983ma.wasm
    ports:
      system:
        - name: i2c
          type: i2c
      environment:
        - name: mag-field
          variable: B_field
          type: vec3

  - name: MUX
    type: mux
    config:
      multiplexed_ports:
        - common: i2c
          channels:
            - i2c1
            - i2c2
    ports:
      system:
        - name: select
          type: bool
        - name: i2c
          type: i2c
        - name: i2c1
          type: i2c
        - name: i2c2
          type: i2c

wires:
  - 
    - component: QEMU1
      port: uart1
    - component: QEMU2
      port: uart0
  - 
    - component: MMC5983MA
      port: i2c
    - component: MUX
      port: i2c
  - 
    - component: MUX
      port: i2c1
    - component: QEMU1
      port: i2c
  - 
    - component: MUX
      port: i2c2
    - component: QEMU2
      port: i2c
  - 
    - component: QEMU1
      port: gpio0
    - component: MUX
      port: select
