# topology_seu_redundant.yaml SEU fault-injection with dual-CPU redundancy
#
# Architecture mirrors demo.yaml:
#
#   CPU_A (primary OBC, fault-injection plugin loaded)
#     └─ gpio13 heartbeat ──> M4 watchdog (timeout=5s for fast testing)
#                               └─ select ──> Mux
#   CPU_B (backup OBC, clean no plugin)
#     └─ i2c / uart ──────────────────> Mux
#
#   Mux routes I2C sensors and UART to whichever CPU M4 selects.
#
# When CPU_A crashes:
#   1. gpio13 heartbeat stops
#   2. M4 detects missing heartbeat after 5s
#   3. M4 asserts select -> Mux switches to CPU_B
#   4. Sensors and transceiver now served by CPU_B
#
# Notes:
#   • CPU_A uses PTY path /tmp/qemu-serial-pty-CPU_A
#   • CPU_B uses PTY path /tmp/qemu-serial-pty-CPU_B
#   • Only CPU_A has the fault-injection plugin and GDB stub
#   • M4 heartbeat_timeout set to 5 (seconds) for faster switchover in tests
# ─────────────────────────────────────────────────────────────────────────────

environment_variables:
  - name: temp
    type: float
  - name: accel
    type: vec3
  - name: omega
    type: vec3
  - name: B_field
    type: vec3

components:

  # ── CPU_A: primary OBC, fault injection target ───────────────────────────

  - name: CPU_A
    type: qemu
    config:
      arch: arm
      mem_mb: 1024
      options:
        - option: cpu
          value: cortex-a7
        - option: M
          value: virt
        - option: kernel
          value: ./image-copy/zImage
        - option: append
          value: "rootwait root=/dev/vda console=hvc0"
        - option: drive
          value: "if=none,file=./image-copy/disk.qcow2,id=hd0"
        - option: device
          value: "virtio-blk-device,drive=hd0"
        - option: nographic
        - option: device
          value: virtio-serial
        - option: chardev
          value: "pty,path=/tmp/qemu-serial-pty-CPU_A,id=char0"
        - option: device
          value: "virtconsole,chardev=char0"
        - option: accel
          value: tcg
        - option: gdb
          value: "tcp::1234"
        - option: plugin
          value: "plugins/fault_inject.so,socket=/tmp/fi.sock,log=/tmp/fault_inject.log"
      i2c_timeout_ms: 10
      ngpio: 16
      nuart: 2
    ports:
      system:
        - name: i2c
          type: i2c
        - name: gpio13
          type: bool
        - name: uart0
          type: bytes

  # ── CPU_B: backup OBC, no plugin ─────────────────────────────────────────

  - name: CPU_B
    type: qemu
    config:
      arch: arm
      mem_mb: 1024
      options:
        - option: cpu
          value: cortex-a7
        - option: M
          value: virt
        - option: kernel
          value: ./image-copy-B/zImage
        - option: append
          value: "rootwait root=/dev/vda console=hvc0"
        - option: drive
          value: "if=none,file=./image-copy-B/disk.qcow2,id=hd0"
        - option: device
          value: "virtio-blk-device,drive=hd0"
        - option: nographic
        - option: device
          value: virtio-serial
        - option: chardev
          value: "pty,path=/tmp/qemu-serial-pty-CPU_B,id=char0"
        - option: device
          value: "virtconsole,chardev=char0"
        - option: accel
          value: tcg
      i2c_timeout_ms: 10
      ngpio: 16
      nuart: 2
    ports:
      system:
        - name: i2c
          type: i2c
        - name: uart0
          type: bytes

  # ── M4: heartbeat watchdog ────────────────────────────────────────────────
  # heartbeat_timeout=5 -> switches to CPU_B 5s after CPU_A heartbeat stops.
  # Reduce further (e.g. 3) to speed up switchover detection in tests.

  - name: M4
    type: wasm
    config:
      module: component_artifacts/m4.wasm
      options:
        - ["heartbeat_timeout", "5"]
    ports:
      system:
        - name: heartbeat
          type: bool
        - name: select
          type: bool

  # ── Mux: routes I2C and UART to the active CPU ───────────────────────────

  - name: Mux
    type: mux
    config:
      multiplexed_ports:
        - common: uart
          channels:
            - uartA
            - uartB
        - common: i2c
          channels:
            - i2cA
            - i2cB
    ports:
      system:
        - name: select
          type: bool
        - name: uart
          type: bytes
        - name: uartA
          type: bytes
        - name: uartB
          type: bytes
        - name: i2c
          type: i2c
        - name: i2cA
          type: i2c
        - name: i2cB
          type: i2c

  # ── Sensors (0x48–0x4F + IMU + MAG) ─────────────────────────────────────
  # CHESS polls all 8 PCT2075 sensors. All share the same `temp` env var.

  - name: PCT2075_0
    type: wasm
    config:
      module: component_artifacts/pct2075tp147.wasm
      options:
        - ["i2cAddress", "0x48"]
    ports:
      system:
        - name: i2c
          type: i2c
      environment:
        - name: temperature
          variable: temp
          type: float

  - name: PCT2075_1
    type: wasm
    config:
      module: component_artifacts/pct2075tp147.wasm
      options:
        - ["i2cAddress", "0x49"]
    ports:
      system:
        - name: i2c
          type: i2c
      environment:
        - name: temperature
          variable: temp
          type: float

  - name: PCT2075_2
    type: wasm
    config:
      module: component_artifacts/pct2075tp147.wasm
      options:
        - ["i2cAddress", "0x4A"]
    ports:
      system:
        - name: i2c
          type: i2c
      environment:
        - name: temperature
          variable: temp
          type: float

  - name: PCT2075_3
    type: wasm
    config:
      module: component_artifacts/pct2075tp147.wasm
      options:
        - ["i2cAddress", "0x4B"]
    ports:
      system:
        - name: i2c
          type: i2c
      environment:
        - name: temperature
          variable: temp
          type: float

  - name: PCT2075_4
    type: wasm
    config:
      module: component_artifacts/pct2075tp147.wasm
      options:
        - ["i2cAddress", "0x4C"]
    ports:
      system:
        - name: i2c
          type: i2c
      environment:
        - name: temperature
          variable: temp
          type: float

  - name: PCT2075_5
    type: wasm
    config:
      module: component_artifacts/pct2075tp147.wasm
      options:
        - ["i2cAddress", "0x4D"]
    ports:
      system:
        - name: i2c
          type: i2c
      environment:
        - name: temperature
          variable: temp
          type: float

  - name: PCT2075_6
    type: wasm
    config:
      module: component_artifacts/pct2075tp147.wasm
      options:
        - ["i2cAddress", "0x4E"]
    ports:
      system:
        - name: i2c
          type: i2c
      environment:
        - name: temperature
          variable: temp
          type: float

  - name: PCT2075_7
    type: wasm
    config:
      module: component_artifacts/pct2075tp147.wasm
      options:
        - ["i2cAddress", "0x4F"]
    ports:
      system:
        - name: i2c
          type: i2c
      environment:
        - name: temperature
          variable: temp
          type: float

  - name: IIM-42652
    type: wasm
    config:
      module: component_artifacts/iim42652.wasm
      options:
        - ["i2cAddress", "0x68"]
    ports:
      system:
        - name: i2c
          type: i2c
      environment:
        - name: acceleration
          variable: accel
          type: vec3
        - name: angular-velocity
          variable: omega
          type: vec3

  - name: MMC5983MA
    type: wasm
    config:
      module: component_artifacts/mmc5983ma.wasm
    ports:
      system:
        - name: i2c
          type: i2c
      environment:
        - name: mag-field
          variable: B_field
          type: vec3

wires:
  - # CPU_A heartbeat -> M4
    - component: CPU_A
      port: gpio13
    - component: M4
      port: heartbeat

  - # M4 select -> Mux
    - component: M4
      port: select
    - component: Mux
      port: select

  - # CPU_A UART -> Mux channel A
    - component: CPU_A
      port: uart0
    - component: Mux
      port: uartA

  - # CPU_B UART -> Mux channel B
    - component: CPU_B
      port: uart0
    - component: Mux
      port: uartB

  - # CPU_A I2C -> Mux channel A
    - component: CPU_A
      port: i2c
    - component: Mux
      port: i2cA

  - # CPU_B I2C -> Mux channel B
    - component: CPU_B
      port: i2c
    - component: Mux
      port: i2cB

  - # Mux common I2C -> all sensors
    - component: Mux
      port: i2c
    - component: PCT2075_0
      port: i2c
    - component: PCT2075_1
      port: i2c
    - component: PCT2075_2
      port: i2c
    - component: PCT2075_3
      port: i2c
    - component: PCT2075_4
      port: i2c
    - component: PCT2075_5
      port: i2c
    - component: PCT2075_6
      port: i2c
    - component: PCT2075_7
      port: i2c
    - component: IIM-42652
      port: i2c
    - component: MMC5983MA
      port: i2c
